<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex Financial: AI Risk Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDF0; --surface:#FFFFFF; --surface-2:#F4F7F8; --ink:#15263A; --muted:#5A6878; --line:#D3DCE2; --line-2:#E3E9ED;
  --accent:#0F6E68; --accent-ink:#FFFFFF; --accent-soft:#DDEEEB;
  --amber:#8A5300; --amber-soft:#FBEACF; --red:#B3261E; --red-soft:#F9E1DF; --green:#2B7649; --green-soft:#DCEFE3;
  --sel:#FFF3C2; --sel-line:#C29400; --control:#77879A;
  --chrome:#13253A; --chrome-2:#1D3550; --chrome-ink:#E6EEF3; --chrome-muted:#9BB0C3;
  --term:#0C151F; --term-2:#121F2C; --term-ink:#C8D6E2; --term-muted:#8A9FB2; --term-line:#1E2E3E;
  --term-sel:#3A3315; --term-hit:#173A27; --term-miss:#3D2E12; --term-wrong:#3E1B1B;
  --sans:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(19,37,58,.06),0 6px 20px rgba(19,37,58,.07);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1721; --surface:#15222E; --surface-2:#1A2937; --ink:#E2EAF0; --muted:#97A8B8; --line:#293A4A; --line-2:#22313F;
    --accent:#52B9AE; --accent-ink:#0B1A1E; --accent-soft:#143338;
    --amber:#E5A34B; --amber-soft:#382A15; --red:#F07A70; --red-soft:#3B1E1E; --green:#6CC48F; --green-soft:#173225;
    --sel:#383116; --sel-line:#D9B43A; --control:#6E8193; --chrome:#09121B; --chrome-2:#132233;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1721; --surface:#15222E; --surface-2:#1A2937; --ink:#E2EAF0; --muted:#97A8B8; --line:#293A4A; --line-2:#22313F;
  --accent:#52B9AE; --accent-ink:#0B1A1E; --accent-soft:#143338;
  --amber:#E5A34B; --amber-soft:#382A15; --red:#F07A70; --red-soft:#3B1E1E; --green:#6CC48F; --green-soft:#173225;
  --sel:#383116; --sel-line:#D9B43A; --control:#6E8193; --chrome:#09121B; --chrome-2:#132233;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:40;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:8px;font-weight:700;text-decoration:none}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}
html,body{height:100%}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px)}
@media (max-width:860px){html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--chrome)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.2}
p{margin:0 0 .75em}
svg.i{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Sign-in ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
#app>.desk{flex:1}
.signin{flex:1;min-height:100%;display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,560px)}
.brand{background:var(--chrome);color:var(--chrome-ink);padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:40px;position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;border:1px solid var(--chrome-2);box-shadow:0 0 0 60px rgba(255,255,255,.015),0 0 0 120px rgba(255,255,255,.012)}
.org{display:flex;align-items:center;gap:14px}
.org b{display:block;font-size:18px}
.org span{font-size:14px;color:var(--chrome-muted)}
.brand h1{font-size:46px;letter-spacing:-.8px;max-width:13ch;margin-bottom:18px}
.brand .lede{font-size:18px;color:var(--chrome-muted);max-width:46ch}
.brand>*{position:relative;z-index:1}
.duty{display:grid;gap:14px;max-width:460px}
.duty div{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--chrome-ink)}
.duty svg{color:#7FD3C9;margin-top:2px}
.panel{background:var(--surface);padding:48px 52px;display:flex;flex-direction:column;justify-content:center}
.panel h2{font-size:26px;margin-bottom:6px}
.panel .sub{color:var(--muted);margin-bottom:28px}
.field{margin-bottom:18px}
label,.lbl{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
input[type=text],textarea.field-ta{width:100%;border:1px solid var(--control);border-radius:8px;background:var(--surface-2);padding:11px 14px}
input[type=text]:focus{border-color:var(--accent);background:var(--surface)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg button{border:1px solid var(--control);border-radius:8px;background:var(--surface);padding:10px 12px;text-align:left;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.seg button:disabled{cursor:not-allowed;color:var(--muted);background:var(--surface-2)}
.seg small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:2px}
.verify{margin-top:34px;border-top:1px solid var(--line);padding-top:16px;font-size:15px}
.verify summary{cursor:pointer;color:var(--muted);padding:4px 0;min-height:28px}
@media (max-width:860px){.signin{grid-template-columns:1fr}.brand{padding:36px 26px}.brand h1{font-size:34px}.panel{padding:32px 26px}.duty{display:none}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:8px;padding:11px 20px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn.quiet{background:transparent;color:var(--muted);padding:8px 10px}
.btn.wide{width:100%;justify-content:center;padding:13px}
.err{color:var(--red);font-size:14px}
.hint{font-size:14px;color:var(--muted)}

/* ---------- Workstation chrome ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--chrome);color:var(--chrome-ink)}
.top-in{display:flex;align-items:center;gap:22px;padding:10px 22px;min-height:60px}
.top .org b{font-size:15px}.top .org span{font-size:12px}
.clock{font-family:var(--mono);font-size:22px;font-weight:500;padding-left:22px;border-left:1px solid var(--chrome-2)}
.clock small{display:block;font-family:var(--sans);font-size:11px;color:var(--chrome-muted);font-weight:400}
.gauges{display:flex;gap:18px;margin-left:auto}
.g{width:118px}
.g .row{display:flex;justify-content:space-between;font-size:12px;color:var(--chrome-muted)}
.g .row b{font-family:var(--mono);font-weight:500;color:var(--chrome-ink)}
.g .bar{height:5px;border-radius:3px;background:var(--chrome-2);margin-top:4px;overflow:hidden}
.g .bar i{display:block;height:100%;background:#5CC3B7;transition:width .8s ease}
.g.mid .bar i{background:#E5A34B}.g.low .bar i{background:#F07A70}
.chip{font-family:var(--mono);font-size:11px;margin-left:4px}
.chip.up{color:#7FD99F}.chip.down{color:#FF9A90}
.badge{display:flex;align-items:center;gap:10px;padding-left:20px;border-left:1px solid var(--chrome-2)}
.badge .who b{display:block;font-size:14px}.badge .who span{font-size:12px;color:var(--chrome-muted)}
.timeline{background:var(--chrome-2);height:4px;position:relative}
.timeline i{position:absolute;left:0;top:0;bottom:0;background:#5CC3B7;transition:width .8s ease}
@media (max-width:1100px){.badge{display:none}}
@media (max-width:860px){.top .org span,.top .org b{display:none}.top-in{gap:12px;padding:8px 14px;flex-wrap:wrap}.clock{padding-left:0;border:0;font-size:19px}.gauges{order:3;width:100%;margin-left:0;gap:10px}.g{flex:1;width:auto}.g .row span{font-size:11px}}

.desk{display:grid;grid-template-columns:300px 1fr;min-height:calc(100% - 64px)}
@media (max-width:860px){.desk{grid-template-columns:1fr}}

/* Queue */
.queue{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.qhead{display:flex;align-items:baseline;justify-content:space-between;padding:18px 18px 10px}
.qhead h2{font-size:16px}
.qhead span{font-size:13px;color:var(--muted)}
.qlist{list-style:none;margin:0;padding:0 8px}
.qi{display:flex;gap:11px;padding:11px 10px;border-radius:8px;margin-bottom:2px;position:relative}
.qi.active{background:var(--accent-soft)}
.qi.active::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent)}
.qi .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:0 0 auto}
.qi.major .ic{background:var(--red-soft);color:var(--red)}
.qi.done .ic{background:var(--green-soft);color:var(--green)}
.qi .tx{min-width:0;flex:1}
.qi .l1{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.qi .l1 time{font-family:var(--mono);font-size:12px}
.qi .l2{font-size:14px;font-weight:700;line-height:1.3;margin-top:2px}
.qi.done .l2{font-weight:400;color:var(--muted)}
.qi .tag{display:inline-block;font-size:11px;margin-top:4px;padding:1px 7px;border-radius:99px}
.tag.best{background:var(--green-soft);color:var(--green)}.tag.ok{background:var(--amber-soft);color:var(--amber)}.tag.poor{background:var(--red-soft);color:var(--red)}
.qfoot{margin-top:auto;padding:14px 18px 20px;border-top:1px solid var(--line-2);font-size:13px;color:var(--muted)}
.qfoot details summary{cursor:pointer;font-weight:700;color:var(--ink);font-size:14px;padding:4px 0;min-height:28px}
.ref{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px}
.ref td{padding:5px 0;border-bottom:1px solid var(--line-2);vertical-align:top}
.ref td:first-child{color:var(--muted);padding-right:8px}
.ref code{font-family:var(--mono);font-size:12px;color:var(--ink)}
.waiting{font-size:13px;color:var(--muted);padding:10px 12px;display:flex;gap:8px;align-items:center}
@media (max-width:860px){
  .queue{border-right:0;border-bottom:1px solid var(--line)}
  .qlist{display:flex;overflow-x:auto;padding:0 10px 12px;gap:6px}
  .qi{flex:0 0 220px;margin:0}
  .qfoot,.waiting{display:none}
}

/* Workspace */
.work{padding:26px 34px 70px;min-width:0}
.work-in{max-width:860px}
@media (max-width:600px){.work{padding:18px 14px 60px}}
.stepper{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0 0 18px;padding:0;font-size:13px}
.stepper li{display:flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;border-radius:99px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.stepper li b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--surface-2);font-family:var(--mono)}
.stepper li.on{color:var(--ink);border-color:var(--accent)}
.stepper li.on b{background:var(--accent);color:var(--accent-ink)}
.stepper li.past b{background:var(--green-soft);color:var(--green)}

.msg{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.mhead{padding:18px 24px 16px;border-bottom:1px solid var(--line-2)}
.mmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:10px}
.src{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink)}
.pri{padding:2px 9px;border-radius:99px;font-size:12px;background:var(--surface-2)}
.pri.high{background:var(--amber-soft);color:var(--amber)}
.pri.crit{background:var(--red-soft);color:var(--red)}
.mhead h1{font-size:24px;letter-spacing:-.3px;margin-bottom:12px}
.sender{display:flex;align-items:center;gap:11px}
.sender .av,.badge .av{color:#fff;font-size:14px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;flex:0 0 auto}
.sender b{display:block;font-size:15px}
.sender span{font-size:13px;color:var(--muted)}
.sender time{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}
.mbody{padding:18px 24px 6px;max-width:72ch}
.mbody blockquote{margin:0 0 .75em;padding:10px 14px;border-left:3px solid var(--line);background:var(--surface-2);border-radius:0 6px 6px 0;font-style:italic}

.section{margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.section h2{font-size:17px}
.section span{font-size:14px;color:var(--muted)}
.taskbar{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:12px 16px;margin-bottom:12px}
.taskbar p{margin:0;font-weight:700;flex:1}
.taskbar .count{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}

/* Evidence windows */
.win{border-radius:10px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface)}
.wbar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px}
.wbar .dots{display:flex;gap:6px}.wbar .dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.wbar b{font-family:var(--mono);font-weight:500;font-size:13px;overflow-wrap:anywhere}
@media (max-width:600px){.wbar span:last-child{display:none}}
.wbar span{margin-left:auto;color:var(--muted)}
.scroll{overflow-x:auto}
table.ev{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px;min-width:560px}
table.ev th{text-align:left;font-weight:500;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap;font-size:12px}
table.ev td{padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:top}
table.ev tr:last-child td{border-bottom:0}
table.ev td.box,table.ev th.box{width:42px;padding-right:0}
table.ev input{width:24px;height:24px;margin:0;accent-color:var(--sel-line);cursor:pointer;vertical-align:middle}
.cb{width:16px;height:16px;border:2px solid var(--control);border-radius:4px;display:block;margin-top:1px}
.single .cb{border-radius:50%}
tr.pick{cursor:pointer}
tr.pick:hover td{background:var(--surface-2)}
tr[data-on] td,tr.pick[data-on]:hover td{background:var(--sel)}
tr[data-on] .cb{background:var(--sel-line);border-color:var(--sel-line);box-shadow:inset 0 0 0 2px var(--surface)}
tr.locked{cursor:default}
tr.hit td{background:var(--green-soft)!important}tr.miss td{background:var(--amber-soft)!important}tr.wrong td{background:var(--red-soft)!important}
.rm{font-family:var(--sans);font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:10px}
tr.hit .rm{background:var(--green);color:var(--surface)}tr.miss .rm{background:var(--amber);color:var(--surface)}tr.wrong .rm{background:var(--red);color:var(--surface)}
/* email source viewer */
table.ev.mail td{white-space:normal}
.sr-only-th{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);padding:0!important;border:0!important}
table.ev.mail td.k{color:var(--muted);width:120px;white-space:nowrap}
/* terminal */
.win.term{background:var(--term);border-color:var(--term-line)}
.win.term .wbar{background:var(--term-2);border-color:var(--term-line);color:var(--term-ink)}
.win.term .wbar span{color:var(--term-muted)}
.win.term .wbar .dots i{background:var(--term-line)}
.term table.ev{color:var(--term-ink)}
.term table.ev th{background:var(--term);color:var(--term-muted);border-color:var(--term-line)}
.term table.ev td{border-color:var(--term-line)}
.term tr.pick:hover td{background:var(--term-2)}
.term tr[data-on] td,.term tr.pick[data-on]:hover td{background:var(--term-sel)}
.term .cb{border-color:#6E8193}
.term tr[data-on] .cb{box-shadow:inset 0 0 0 2px var(--term)}
.term tr.hit td{background:var(--term-hit)!important}.term tr.miss td{background:var(--term-miss)!important}.term tr.wrong td{background:var(--term-wrong)!important}
.term .prompt{padding:9px 14px 0;font-family:var(--mono);font-size:12px;color:var(--term-muted)}

/* Choices */
.choices{display:grid;gap:10px;border:0;margin:0;padding:0;min-width:0}
.choice{display:flex;gap:14px;text-align:left;font-weight:400;font-size:16px;margin:0;border:1px solid var(--control);border-radius:10px;background:var(--surface);padding:15px 18px;cursor:pointer;line-height:1.45}
.choice:hover{border-color:var(--accent)}
.choice .k{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;background:var(--surface-2);color:var(--accent);flex:0 0 auto}
.choice:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.choice.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.choice.on .k{background:var(--accent);color:var(--accent-ink)}
.notes{background:var(--surface);border:1px solid var(--control);border-radius:10px;overflow:hidden}
.notes .nh{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line-2);font-size:13px;color:var(--muted)}
.notes textarea{display:block;width:100%;min-height:120px;border:0;background:transparent;padding:14px 16px;resize:vertical;line-height:1.5}
.notes textarea:focus{outline:none}
.notes:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.compose:focus-within{box-shadow:0 0 0 3px var(--accent)}
.notes .nf{padding:8px 16px;border-top:1px solid var(--line-2);font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:20px}

/* Debrief */
.aar{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.verdict{display:flex;gap:14px;padding:18px 22px}
.verdict .vi{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.verdict.best{background:var(--green-soft)}.verdict.best .vi{background:var(--green);color:var(--surface)}
.verdict.ok{background:var(--amber-soft)}.verdict.ok .vi{background:var(--amber);color:var(--surface)}
.verdict.poor{background:var(--red-soft)}.verdict.poor .vi{background:var(--red);color:var(--surface)}
.verdict h3{font-size:18px;margin-bottom:4px}
.verdict p{margin:0}
.fx{display:flex;flex-wrap:wrap;gap:8px;padding:12px 22px;border-top:1px solid var(--line-2)}
.fx span{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--surface-2)}
.fx span b{font-family:var(--mono);font-weight:600}
.fx .up b{color:var(--green)}.fx .down b{color:var(--red)}
.aar .inv{padding:16px 22px;border-top:1px solid var(--line-2)}
.aar .inv h3{font-size:16px;margin-bottom:6px}
.ref-box{display:flex;gap:12px;padding:16px 22px;border-top:1px solid var(--line-2);background:var(--surface-2);font-size:15px}
.ref-box svg{color:var(--accent);margin-top:3px}
.ref-box p{margin:0}

/* Compose */
.compose .row{display:flex;gap:10px;padding:10px 24px;border-bottom:1px solid var(--line-2);font-size:14px}
.compose .row span{color:var(--muted);width:64px}
.compose textarea{display:block;width:100%;min-height:240px;border:0;background:transparent;padding:16px 24px;resize:vertical;line-height:1.55}
.compose textarea:focus{outline:none}
.compose .nf{padding:10px 24px;border-top:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Report */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:44px 52px;max-width:860px}
@media (max-width:600px){.doc{padding:26px 20px}}
.lh{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:20px;border-bottom:2px solid var(--ink);margin-bottom:24px}
.lh .org span{color:var(--muted)}
.lh .rid{text-align:right;font-size:13px;color:var(--muted)}
.lh .rid b{display:block;font-family:var(--mono);color:var(--ink);font-size:14px}
.doc h1{font-size:30px;letter-spacing:-.4px;margin-bottom:6px}
.doc h2{font-size:18px;margin:30px 0 10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:20px 0}
.fact{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.fact span{display:block;font-size:13px;color:var(--muted)}
.fact b{font-family:var(--mono);font-size:22px;font-weight:500}
.fact .bar{height:4px;border-radius:2px;background:var(--line-2);margin-top:8px;overflow:hidden}
.fact .bar i{display:block;height:100%;background:var(--accent)}
.entry{border-top:1px solid var(--line);padding:16px 0}
.entry h3{font-size:16px;margin-bottom:4px}
.entry .meta{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.quote{border-left:3px solid var(--accent);padding:2px 0 2px 14px;white-space:pre-wrap;font-style:italic}
.code{font-family:var(--mono);font-size:12px;word-break:break-all;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
table.kv{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
table.kv th,table.kv td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.kv th{color:var(--muted);font-weight:400}

/* Toast */
.toast{position:fixed;right:20px;top:calc(env(safe-area-inset-top,0px) + 76px);z-index:30;display:flex;gap:12px;align-items:flex-start;background:var(--chrome);color:var(--chrome-ink);padding:14px 18px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:340px;transform:translateX(calc(100% + 40px));visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s}
.toast.show{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.toast .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--chrome-2);flex:0 0 auto}
.toast.major .ic{background:#B3261E}
.toast b{display:block;font-size:14px}.toast span{font-size:13px;color:var(--chrome-muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

@media print{
  .top,.queue,.noprint,.toast{display:none!important}
  .desk{display:block}.work{padding:0}.doc{border:0;box-shadow:none;padding:0;max-width:none}
  body{background:#fff}
}
</style>

function findLabel(f){ return f===2?"you found everything":f===1?"you found part of it":"you missed the key evidence"; }
function canDecide(ev){ return !!st.choice && (!ev.reason || st.reason.trim().length>=60); }

function bindEvent(ev){
  if(st.phase==="investigate"){
    app.querySelectorAll("input[name=evsel]").forEach(function(inp){
      inp.onchange=function(){
        var i=+inp.dataset.line;
        if(ev.task.mode==="single") st.sel=[i];
        else { var k=st.sel.indexOf(i); if(k>-1) st.sel.splice(k,1); else st.sel.push(i); }
        save(); keep("input[name=evsel][data-line='"+i+"']");
      };
    });
    app.querySelectorAll("tr.pick").forEach(function(row){
      row.onclick=function(e){ if(e.target.tagName!=="INPUT"){ row.querySelector("input").click(); } };
    });
    document.getElementById("submitFind").onclick=function(){ st.phase="decide"; save(); render(); focusEl("callH"); };
  }
  if(st.phase==="decide"){
    app.querySelectorAll("input[name=choice]").forEach(function(b){ b.onchange=function(){ st.choice=b.value; save(); keep("input[name=choice][value='"+st.choice+"']"); }; });
    var r=document.getElementById("reason");
    if(r) r.oninput=function(){ st.reason=r.value; save(); var len=r.value.trim().length; document.getElementById("submitChoice").disabled=!canDecide(ev); document.getElementById("rc").textContent=len>=60?"Ready":"At least 60 characters"; r.parentNode.querySelector(".nf span:last-child").textContent=len+" characters"; };
    document.getElementById("submitChoice").onclick=function(){ decide(ev); };
  }
  if(st.phase==="debrief"){
    var evs = getEvents();
    document.getElementById("next").onclick=function(){
      if(st.idx<evs.length-1){ st.idx++; st.phase="investigate"; st.sel=[]; st.choice=null; st.reason=""; save(); render(); toTop(); arrive(); }
      else { st.screen="handoff"; save(); render(); toTop(); }
    };
  }
}

function decide(ev){
  var flagged=[]; ev.artifact.rows.forEach(function(r,i){ if(r.f) flagged.push(i); });
  var hits=st.sel.filter(function(i){return flagged.indexOf(i)>-1;}).length, wrong=st.sel.length-hits;
  var found=(hits===flagged.length&&wrong==0)?2:(hits>0?1:0);
  var c=ev.choices.filter(function(x){return x.k===st.choice;})[0];
  var fx=Object.assign({},c.fx), outcome=c.o;
  if(found===2) fx.sec=(fx.sec||0)+2;
  if(found===0) fx.sec=(fx.sec||0)-4;
  if(ev.dynamic){
    if(st.flags.broadData || st.flags.broadAccess){
      if(c.q==="best"){ fx.sec=(fx.sec||0)-8; outcome+=" But forensics shows the compromised service token gave the attacker unmasked access to core databases. Your 07:15 broad data approval made this a reportable regulatory breach."; }
      else { fx.sec=(fx.sec||0)-12; fx.ops=(fx.ops||0)-10; fx.trust=(fx.trust||0)-6; outcome+=" Worse, the unmasked core database access approved at 07:15 let the attacker exfiltrate sensitive records. This is a severe regulatory violation."; }
    } else { fx.trust=(fx.trust||0)+2; outcome+=" Your 07:15 decision paid off: data isolation and tokenization prevented the compromised token from accessing raw core data assets."; }
  }
  if(c.set) st.flags[c.set]=true;
  Object.keys(fx).forEach(function(k){ st.meters[k]=clamp(st.meters[k]+fx[k]); });
  st.log.push({id:ev.id, found:found, choice:c.k, q:c.q, fx:fx, outcome:outcome, reason:ev.reason?st.reason.trim():""});
  st.phase="debrief"; save(); render(); focusEl("aarH");
}

function score(){ var p=0; st.log.forEach(function(e){ p+=({best:3,ok:1,poor:0})[e.q]+e.found; }); var evs = getEvents(); return {pts:p,max:evs.length*5}; }
function fnv(s){ var h=0x811c9dc5; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(36); }
function b64e(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64d(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; return decodeURIComponent(escape(atob(s))); }
function reportCode(){
  var sc=score(), j=JSON.stringify({n:st.name,ind:st.industry,indName:st.industryName,f:"shift",d:st.finishedAt,m:st.meters,sc:sc.pts+"/"+sc.max,e:st.log.map(function(e){return [e.id,e.found,e.choice];})});
  return b64e(j)+"."+fnv(SALT+j);
}
function verify(code){ var p=code.trim().split("."); if(p.length!==2) return null; try{ var j=b64d(p[0]); if(fnv(SALT+j)!==p[1]) return null; return JSON.parse(j); }catch(e){ return null; } }
function reportId(){ return "APEX-AI-" + fnv(st.name+st.finishedAt).toUpperCase().slice(0,6); }

function reportDoc(){
  var sc=score(), evs = getEvents(), found=st.log.filter(function(e){return e.found===2;}).length, strong=st.log.filter(function(e){return e.q==="best";}).length;
  var h='<article class="doc"><div class="lh"><div class="org">'+MARK+'<div><b>Apex Financial Corporation</b><span>AI Governance & Risk Office</span></div></div><div class="rid">Report<b>'+reportId()+'</b>'+esc(new Date(st.finishedAt).toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"}))+'</div></div>';
  h+='<h1 tabindex="-1">AI Risk Operations Performance Report</h1><p style="color:var(--muted)">'+esc(st.name)+'. Track: <b>'+esc(st.industryName)+'</b>. One shift (07:00 to 19:00).</p>';
  h+='<div class="facts"><div class="fact"><span>Overall score</span><b>'+sc.pts+'/'+sc.max+'</b></div><div class="fact"><span>Evidence fully found</span><b>'+found+'/'+evs.length+'</b></div><div class="fact"><span>Strong decisions</span><b>'+strong+'/'+evs.length+'</b></div></div>';
  h+='<h2>Enterprise status at end of shift</h2><div class="facts">'+METERS.map(function(m){ var v=st.meters[m[0]], d=v-START[m[0]]; return '<div class="fact"><span>'+m[1]+'</span><b>'+v+'</b> <span style="display:inline">'+(d>=0?"+":"")+d+' from start</span><div class="bar"><i style="width:'+v+'%"></i></div></div>'; }).join("")+'</div>';
  h+='<h2>Decision log</h2>';
  st.log.forEach(function(e){
    var ev=evById(e.id), c=ev.choices.filter(function(x){return x.k===e.choice;})[0];
    h+='<div class="entry"><h3>'+ev.time+', '+esc(ev.title)+'</h3><div class="meta"><span class="tag '+e.q+'" style="padding:1px 8px;border-radius:99px">'+TAG[e.q]+' decision</span><span>Evidence: '+findLabel(e.found)+'</span></div>';
    h+='<p><b>Chose '+e.choice+'.</b> '+esc(c.t)+'</p><p>'+esc(e.outcome)+'</p>';
    if(e.reason) h+='<p class="quote">'+esc(e.reason)+'</p>';
    h+='</div>';
  });
  h+='<h2>Handoff note to night shift</h2><p class="quote">'+esc(st.handoff)+'</p>';
  h+='<h2>Verification code</h2><p>Your instructor can paste this code into the game to confirm the scores and decisions in this report.</p><div class="code">'+reportCode()+'</div></article>';
  return h;
}

function renderReport(){
  setTitle("Shift report");
  var h = reportDoc() + '<div class="actions noprint"><button class="btn" id="dl">'+ic("dl")+'Download report</button><button class="btn ghost" id="print">'+ic("print")+'Print or save as PDF</button><span class="hint" id="dlStatus" role="status"></span></div>' +
    '<div class="actions noprint"><button class="btn quiet" id="restart">Start a new shift</button></div>';
  shell(h);
  document.getElementById("dl").onclick=downloadReport;
  document.getElementById("print").onclick=function(){ try{ window.print(); }catch(e){ document.getElementById("dlStatus").textContent="Printing isn’t available here. Use Download report instead."; } };
  document.getElementById("restart").onclick=function(){ if(confirm("Start a new shift? This report will be cleared from this browser, so download it first.")){ clearSave(); st=fresh(); render(); } };
}

function reportFile(){
  var css=document.querySelector("style").textContent;
  return '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shift report, '+esc(st.name)+'</title><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>'+css+' body{padding:28px}.doc{margin:0 auto}</style></head><body>'+reportDoc()+'</body></html>';
}

function downloadReport(){
  var status=document.getElementById("dlStatus");
  var fname="ai-risk-shift-report-"+st.name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+".html";
  var c=window.claude;
  if(!c||!c.use){ status.textContent="Downloads aren’t available here. Use Print or save as PDF."; return; }
  status.textContent="Preparing…";
  c.use("downloads").then(function(d){
    if(!d){ status.textContent="Downloads aren’t available here. Use Print or save as PDF."; return; }
    return d.save({filename:fname,data:reportFile()}).then(function(){ status.textContent="Report saved. Upload it to your course site."; })
      .catch(function(e){ var k=e&&e.code; status.textContent=k==="declined"?"Download canceled.":k==="rate_limited"?"A download prompt is already open.":"The download didn’t work. Use Print or save as PDF."; });
  });
}

function keep(sel){ var y=window.scrollY; render(); window.scrollTo(0,y); var el=app.querySelector(sel); if(el) el.focus({preventScroll:true}); }
function focusEl(id){ var el=document.getElementById(id); if(el){ el.focus({preventScroll:true}); el.scrollIntoView({block:"start"}); } }
function toTop(){ window.scrollTo(0,0); var h=app.querySelector("h1[tabindex]"); if(h) h.focus({preventScroll:true}); }
var toastTimer;
function hideToast(){ var t=document.getElementById("toast"); if(t) t.classList.remove("show"); }
document.addEventListener("keydown",function(e){ if(e.key!=="Shift") hideToast(); });
document.addEventListener("pointerdown",hideToast);
function arrive(){
  var evs = getEvents();
  var e=evs[st.idx], p=PEOPLE[e.who], t=document.getElementById("toast");
  t.className="toast"+(e.kind==="major"?" major":"");
  t.innerHTML='<span class="ic">'+ic(e.ch)+'</span><div><b>'+(e.kind==="major"?"Critical alert":"New item")+' at '+e.time+'</b><span>'+esc(p.n)+': '+esc(e.title)+'</span></div>';
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ t.classList.add("show"); }); });
  clearTimeout(toastTimer); toastTimer=setTimeout(hideToast,4200);
}

renderStart();
})();
</script>
</body>
</html>
